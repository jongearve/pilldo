name: Compilar APK de Poquito

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar la carpeta del proyecto
        id: find
        run: |
          CFG=$(find . -name capacitor.config.json -not -path "*/node_modules/*" -not -path "*/android/*" | head -1)
          if [ -z "$CFG" ]; then
            echo "No encontré capacitor.config.json. Sube el CONTENIDO del zip descomprimido, no el .zip."
            exit 1
          fi
          echo "dir=$(dirname "$CFG")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar y preparar la interfaz
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Compilar APK
        working-directory: ${{ steps.find.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Poquito-APK
          path: ${{ steps.find.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
